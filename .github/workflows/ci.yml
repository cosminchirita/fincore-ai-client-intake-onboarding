name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest --cov=services/api/app --cov-report=term-missing
      - run: python -m compileall services
      - run: python -m json.tool workflows/n8n/fincore_lead_intake.json >/dev/null
      - run: python -m json.tool workflows/n8n/fincore_error_handler.json >/dev/null
